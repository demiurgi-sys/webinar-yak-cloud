# ============================================================
#  nginx вебінару — чистий :80.
#
#  TLS більше НЕ тут: на 443 стоїть Traefik (edge-проксі), він термінує
#  HTTPS Origin Cert-ом і проксує на цей nginx по HTTP всередині мережі
#  traefik-public. Тож жодного listen 443 / ssl_certificate / редиректу
#  80→443 / ACME-challenge — усе це прибрано.
#
#  Два домени на одному nginx, розводяться за server_name:
#    webinar.school-design.space — лендинг (статика + форма)
#    api.school-design.space     — JSON-API для SmartSender/Facebook
#  Усе інше (прямий IP, чужий Host) → 444.
# ============================================================

# ------------------------------------------------------------
#  Fallback для прямого IP та чужих Host-заголовків
# ------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;  # рвемо з'єднання для всіх сторонніх хостів
}

# ------------------------------------------------------------
#  api.school-design.space — API + JSON-корінь
# ------------------------------------------------------------
server {
    listen 80;
    server_name api.school-design.space;

    # Справжній IP відвідувача з Cloudflare. Без цього $remote_addr = IP Traefik
    # (172.x), і X-Real-IP / X-Forwarded-For на app їдуть із внутрішнім IP проксі.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass         http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /lead.php {
        proxy_pass http://app:4000/api/submit;
    }

    location = /healthz {
        proxy_pass http://app:4000/healthz;
    }

    location = / {
        return 200 '{"service":"webinar-api","status":"ok"}';
        add_header Content-Type application/json;
    }

    # API-домен не має фавіконки, але браузери її завжди просять → 204.
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /favicon.png { access_log off; log_not_found off; return 204; }
}

# ------------------------------------------------------------
#  webinar.school-design.space — лендинг
# ------------------------------------------------------------
server {
    listen 80;
    server_name webinar.school-design.space;

    # Справжній IP відвідувача з Cloudflare. Без цього $remote_addr = IP Traefik
    # (172.x), і X-Real-IP / X-Forwarded-For на app їдуть із внутрішнім IP проксі.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Статика з кешем
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Проксі на Node API (щоб фронт стукав на /api/* по тому самому домену — без CORS)
    location /api/ {
        proxy_pass         http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /lead.php {
        proxy_pass http://app:4000/api/submit;
    }

    location = /healthz {
        proxy_pass http://app:4000/healthz;
    }

    # HTML лендінгу: браузер щоразу питає сервер (ETag/Last-Modified -> 304), бо без Cache-Control він
    # кешував сторінку евристично (години) і правки доходили із запізненням. Статика вище лишається на 7 днів
    # (immutable) і скидається параметром ?v= в index.html.
    # add_header всередині location скидає всі add_header, успадковані з рівня server, тож заголовки
    # безпеки повторено тут.
    # SPA-style fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
